name: macOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed history for secrets
        run: |
          brew install gitleaks
          gitleaks git --redact --no-banner --log-opts="--all --full-history" .
      - name: Run tests
        run: ./scripts/test.sh -Xswiftc -warnings-as-errors
      - name: Verify file transfers to an App Sandbox reader
        run: ./scripts/test-sandbox-transfer.sh
      - name: Build application
        run: ./scripts/build-app.sh --universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CopyTaste-macOS
          path: dist/CopyTaste-macOS.zip
          archive: true
          if-no-files-found: error
